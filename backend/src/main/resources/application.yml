server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: crossed
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 3s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mail:
    host: ${MAIL_HOST:sin-configurar}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  task:
    scheduling:
      pool:
        size: 2
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false
crossed:
  origenes: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mail-from: ${MAIL_FROM:}
  mail-from-name: ${MAIL_FROM_NAME:CrossEd}
  brevo-api-key: ${BREVO_API_KEY:}
  brevo-api-url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
  ia:
    openai-key: ${OPENAI_API_KEY:}
    gemini-key: ${GEMINI_API_KEY:}
    openai-model: ${OPENAI_MODEL:gpt-4o-mini}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}
logging:
  level:
    org.springframework.ai: OFF
    org.springframework.web.socket: ERROR
